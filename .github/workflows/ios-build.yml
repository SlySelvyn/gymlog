# Builds the iOS app with real Xcode against the iOS Simulator SDK on a cloud
# macOS runner — the closest thing to an "Xcode emulator" available from a
# Windows dev machine.
#
# Manual trigger only (workflow_dispatch): this repo is private and macOS
# minutes bill at 10x, so runs are spent deliberately — Actions tab → this
# workflow → "Run workflow". The Linux Docker workflow covers every push.
name: iOS build (Xcode + Simulator SDK)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project GymLog.xcodeproj \
            -scheme GymLog \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            > build.log 2>&1 \
            || { echo "=== COMPILE ERRORS ==="; grep -E "error:" -A 3 build.log; exit 1; }
          tail -5 build.log

      # Universal (arm64 + x86_64) simulator bundle. Download this artifact,
      # then upload the zip to appetize.io to run GymLog in a browser.
      - name: Package simulator .app for online simulators
        run: |
          cd DerivedData/Build/Products/Debug-iphonesimulator
          zip -qry GymLog-simulator-app.zip GymLog.app

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: GymLog-simulator-app
          path: DerivedData/Build/Products/Debug-iphonesimulator/GymLog-simulator-app.zip

      - name: Upload full build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build.log
